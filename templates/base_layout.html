<!DOCTYPE html>
<html lang="vi">
{% load static %}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Quản lý thanh toán và theo dõi giao dịch VNPay">
    <title>{{ title }} · VNPay Demo</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <a class="brand" href="{% url 'index' %}">
            <span class="brand-mark">V</span>
            <span>VNPay <span class="brand-light">Dashboard</span></span>
        </a>
        <nav class="main-nav" aria-label="Điều hướng chính">
            <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">Tổng quan</a>
            <a href="{% url 'transactions' %}" class="{% if request.resolver_match.url_name == 'transactions' %}active{% endif %}">Giao dịch</a>
            <a href="{% url 'payment' %}" class="{% if request.resolver_match.url_name == 'payment' %}active{% endif %}">Tạo thanh toán</a>
            <a href="{% url 'query' %}" class="{% if request.resolver_match.url_name == 'query' %}active{% endif %}">Tra cứu VNPay</a>
            <a href="{% url 'refund' %}" class="{% if request.resolver_match.url_name == 'refund' %}active{% endif %}">Hoàn tiền</a>
        </nav>
    </header>
    <main class="page-container">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="app-footer">
        <span>VNPay Demo · Môi trường thử nghiệm</span>
        <span>&copy; {% now "Y" %}</span>
    </footer>
</div>
</body>
</html>
