{% extends "base_layout.html" %}
{% block content %}

    <section class="page-heading">
        <div><span class="eyebrow">CÔNG CỤ VNPAY</span><h1>{{ title }}</h1><p>Gửi yêu cầu hoàn tiền cho giao dịch Sandbox.</p></div>
    </section>
    <section class="content-card form-card">
    <div class="form-content">
        <form action="{% url "refund" %}" id="create_form" method="post">

            <div class="form-group">
                <label for="order_id">Mã hóa đơn</label>
                <input class="form-control" id="order_id"
                       name="order_id" type="text"/>
            </div>
            <div class="form-group">
                <label>Kiểu hoàn tiền</label>
                <select name="TransactionType" id="trantype" class="form-control">
                    <option value="02">Hoàn tiền toàn phần</option>
                    <option value="03">Hoàn tiền một phần</option>
                </select>
            </div>
            <div class="form-group">
                <label for="amount">Số tiền hoàn trả</label>
                <input class="form-control" id="amount"
                       name="amount" type="text"/>
            </div>
            <div class="form-group">
                <label for="trans_date">Thời gian giao dịch thanh toán</label>
                <input class="form-control" id="trans_date"
                       name="trans_date" type="text"/>
            </div>
            <div class="form-group">
                <label for="order_desc">Nội dung/lý do hoàn trả</label>
                <input class="form-control" id="order_desc"
                       name="order_desc" type="text"/>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Gửi yêu cầu hoàn tiền</button>
            </div>
            {% csrf_token %}
        </form>
        {% if response_json %}
            {% for key,val in response_json.items %}
             <div class="form-group">
                <label>{{ key }} : {{ val }}</label>
            </div>
            {% endfor %}

        {% endif %}
    </div>
    </section>

{% endblock %}
