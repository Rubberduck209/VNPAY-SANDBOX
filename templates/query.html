{% extends "base_layout.html" %}
{% block content %}

    <section class="page-heading">
        <div><span class="eyebrow">CÔNG CỤ VNPAY</span><h1>{{ title }}</h1><p>Tra cứu trạng thái giao dịch trực tiếp với hệ thống VNPay.</p></div>
    </section>
    <section class="content-card form-card">
    <div class="form-content">
        <form action="{% url "query" %}" id="create_form" method="post">

            <div class="form-group">
                <label for="order_id">Mã hóa đơn</label>
                <input class="form-control" id="order_id"
                       name="order_id" type="text"/>
            </div>
            <div class="form-group">
                <label for="trans_date">Thời gian thanh toán</label>
                <input class="form-control" id="trans_date"
                       name="trans_date" type="text"/>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Tra cứu giao dịch</button>
            </div>

            {% csrf_token %}
        </form>
        {% if response_json %}
            {% for key,val in response_json.items %}
             <div class="form-group">
                <label>{{ key }} : {{ val }}</label>
            </div>
            {% endfor %}

        {% endif %}
    </div>
    </section>

{% endblock %}
